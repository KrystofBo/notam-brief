<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOTAM Brief</title>
<style>
:root{
  --bg:#f5f5f2;--card:#fff;--fg:#1b1d20;--mut:#62666c;--faint:#8a8e94;--line:#e1e1dc;--code:#f1f1ec;--accent:#1f5fbf;--accent-fg:#fff;
  --hi:#b83227;--hi-bg:#fbebe9;--me:#a86a12;--me-bg:#fcf3e3;--lo:#3f6aa8;--lo-bg:#ebf1f9;--ok:#2f7d4f;--warn-bg:#fff4d6;--warn:#8a5a00;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619;--card:#1c1f23;--fg:#e8e8e5;--mut:#a2a6ac;--faint:#7c8086;--line:#30343a;--code:#15171a;--accent:#6ea2ff;--accent-fg:#0d1117;
  --hi:#f2796c;--hi-bg:#3a211e;--me:#e8b560;--me-bg:#362b18;--lo:#90b3e6;--lo-bg:#1d2837;--ok:#6cc596;--warn-bg:#3a3018;--warn:#f0c667;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 72px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:22px;margin:0;display:flex;align-items:center;gap:8px}
header .tag{color:var(--mut);font-size:14px}
header .disc{margin-left:auto;font-size:12px;color:var(--faint);max-width:330px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
form.card{padding:16px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.f input,.f select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.code-in{text-transform:uppercase;font-family:ui-monospace,Consolas,monospace}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.presets span{font-size:12px;color:var(--mut);font-weight:600;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.actions{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
button.go{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
button.go:disabled{opacity:.6;cursor:progress}
#status{color:var(--mut);font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
#out{margin-top:22px}
.err{padding:14px 16px;border-color:var(--hi);color:var(--hi);background:var(--hi-bg)}
.routeline{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0 0 12px}
.routeline h2{font-size:20px;margin:0}.routeline .meta{color:var(--mut);font-size:14px}
.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}.stat .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--mut);font-size:13px}.stat.key .n{color:var(--accent)}
.pris{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:4px}
.p-high{--c:var(--hi);--cb:var(--hi-bg)}.p-medium{--c:var(--me);--cb:var(--me-bg)}.p-low{--c:var(--lo);--cb:var(--lo-bg)}
.pill{background:var(--cb);color:var(--c)}
.wx{padding:14px 16px;margin-bottom:16px}
.wx h3,.sec h3{font-size:14px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.wx p{margin:0 0 10px}
.wx .st{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.wx .st div{background:var(--code);border-radius:7px;padding:8px 10px}
.wx .st b{font-size:13px}.wx .st small{color:var(--faint)}
pre,.mono{font:12px/1.45 ui-monospace,Consolas,monospace}
.wx pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--mut)}
.warnbox{padding:12px 16px;margin-bottom:16px;background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-left:4px solid var(--c);margin-bottom:10px;overflow:hidden}
.item .plain{padding:12px 14px}
.item .hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.item .hdr code{font-size:13px;font-weight:600}.item .hdr .loc{color:var(--mut);font-size:13px}
.item .sum{margin:6px 0 4px;font-size:15px}
.item .why{color:var(--mut);font-size:13px;margin:0}
.item .valid{color:var(--faint);font-size:12px;margin-top:6px}
.item .geo{color:var(--mut);font-size:12px;margin-top:6px}
.item pre{margin:0;padding:12px 14px;background:var(--code);border-left:1px solid var(--line);white-space:pre-wrap;word-break:break-word;color:var(--mut)}
.sec{margin-top:18px}
details.card{padding:10px 14px;margin-top:14px}
details summary{cursor:pointer;color:var(--mut);font-weight:600}
.nr{border-top:1px solid var(--line);padding:8px 0}.nr:first-of-type{border-top:0}
.nr .line{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.nr .line code{font-weight:600}.nr .line span{color:var(--mut)}
.nr details summary{font-weight:400;font-size:12px;color:var(--faint)}
.nr pre{white-space:pre-wrap;word-break:break-word;color:var(--mut);background:var(--code);padding:8px 10px;border-radius:6px;margin:6px 0 0}
.foot{margin-top:18px;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.foot div{font-size:13px}.foot b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.small{color:var(--faint);font-size:12px;margin-top:10px}
.empty{padding:14px 16px;color:var(--mut)}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.span2,.span3{grid-column:span 2}
  .item{grid-template-columns:1fr}.item pre{border-left:0;border-top:1px solid var(--line)}.funnel{grid-template-columns:1fr}
  header .disc{margin-left:0;text-align:left}}
</style>
</head>
<body>
<main>
<header>
  <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>NOTAM Brief</h1>
  <span class="tag">Only the NOTAMs that affect your VFR flight, explained in plain language.</span>
  <span class="disc">Decision support, not an official briefing. Source: EAD-derived bulletins (notaminfo.com) and aviationweather.gov. The pilot in command decides.</span>
</header>

<form class="card" id="f" autocomplete="off">
  <div class="grid">
    <div class="f"><label for="dep">Departure</label><input id="dep" class="code-in" list="ads" required maxlength="4" placeholder="EHLE"></div>
    <div class="f"><label for="dest">Destination</label><input id="dest" class="code-in" list="ads" required maxlength="4" placeholder="EHHV"></div>
    <div class="f span2"><label for="via">Via (optional: ICAO codes or lat,lon)</label><input id="via" class="code-in" placeholder="52.46,4.57"></div>
    <div class="f span2"><label for="alternate">Alternate (optional)</label><input id="alternate" class="code-in" list="ads" maxlength="4"></div>
    <div class="f span2"><label for="time">Departure time (UTC)</label><input id="time" type="datetime-local"></div>
    <div class="f"><label for="alt">Max altitude (ft AMSL)</label><input id="alt" type="number" min="500" max="12000" step="500" value="3000"></div>
    <div class="f"><label for="source">NOTAM data</label><select id="source"><option value="live">Live bulletins</option></select></div>
    <div class="f span2"><label for="model">Model (Nebius Token Factory)</label><select id="model"></select></div>
  </div>
  <div class="presets" id="presets"><span>Test routes</span></div>
  <div class="actions">
    <button class="go" id="go" type="submit">Get briefing</button>
    <label class="toggle"><input type="checkbox" id="prefilter" checked> Route pre-filter</label>
    <label class="toggle"><input type="checkbox" id="reasoning"> Model reasoning (slower)</label>
    <span id="status"></span>
  </div>
  <datalist id="ads"></datalist>
</form>

<div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let META = null, preset = null;

function nextHourUTC() {
  const d = new Date(Date.now() + 3600e3); d.setUTCMinutes(0, 0, 0);
  return d.toISOString().slice(0, 16);
}
const hhmm = iso => iso ? iso.slice(11, 13) + iso.slice(14, 16) + "Z" : "";
const day = iso => iso ? iso.slice(0, 10) : "";

async function init() {
  $("#time").value = nextHourUTC();
  META = await (await fetch("/api/meta")).json();
  $("#ads").innerHTML = META.aerodromes.map(([c, n]) => `<option value="${esc(c)}">${esc(n)}</option>`).join("");
  for (const s of META.snapshots) {
    const tag = s === META.eval.snapshot ? " (labelled test set)" : "";
    $("#source").insertAdjacentHTML("beforeend", `<option value="${esc(s)}">Snapshot ${esc(s)}${tag}</option>`);
  }
  for (const r of META.routes) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.title = r.why || "";
    b.textContent = `${r.id} · ${r.dep} → ${r.dest}`;
    b.onclick = () => usePreset(r, b);
    $("#presets").appendChild(b);
  }
  const sel = $("#model");
  sel.innerHTML = `<option>${esc(META.default_model)}</option>`;
  fetch("/api/models").then(r => r.json()).then(d => {
    const ids = d.models.filter(m => !/embed|flux|image|guard|whisper|tts|vl|vision/i.test(m));
    if (!ids.includes(META.default_model)) ids.unshift(META.default_model);
    sel.innerHTML = ids.map(m => `<option ${m === META.default_model ? "selected" : ""}>${esc(m)}</option>`).join("");
  }).catch(() => {});
  for (const id of ["dep", "dest", "via"]) $("#" + id).addEventListener("input", clearPreset);
}

function usePreset(r, btn) {
  $("#dep").value = r.dep; $("#dest").value = r.dest; $("#via").value = (r.via || []).join(" ");
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  btn.classList.add("on"); preset = r.id;
}
function clearPreset() { preset = null; document.querySelectorAll(".chip").forEach(c => c.classList.remove("on")); }

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    dep: $("#dep").value.trim().toUpperCase(), dest: $("#dest").value.trim().toUpperCase(),
    via: $("#via").value.trim(), alternate: $("#alternate").value.trim().toUpperCase(),
    dep_time: $("#time").value, alt_ft: +$("#alt").value || 3000, model: $("#model").value,
    source: $("#source").value, prefilter: $("#prefilter").checked, reasoning: $("#reasoning").checked, preset,
  };
  const go = $("#go"); go.disabled = true;
  const t0 = Date.now();
  const tick = () => $("#status").innerHTML = `<span class="spin"></span>Filtering bulletins and asking ${esc(body.model.split("/").pop())}… ${Math.round((Date.now() - t0) / 1000)} s`;
  tick(); const timer = setInterval(tick, 500);
  $("#out").innerHTML = "";
  try {
    const r = await fetch("/api/brief", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    render(d);
    $("#status").textContent = `Done in ${((Date.now() - t0) / 1000).toFixed(1)} s`;
  } catch (err) {
    $("#out").innerHTML = `<div class="card err"><b>Briefing failed.</b> ${esc(err.message)}</div>`;
    $("#status").textContent = "";
  } finally { clearInterval(timer); go.disabled = false; }
});

function itemCard(x) {
  const p = x.priority.toLowerCase();
  const valid = [x.valid_from ? `from ${day(x.valid_from)} ${hhmm(x.valid_from)}` : "", x.valid_to_raw ? `to ${x.valid_to_raw}` : "",
                 x.schedule ? `schedule ${x.schedule}` : ""].filter(Boolean).join(" · ");
  const geo = x.geometry ? `<div class="geo">Position: ${esc(x.geometry)}</div>` : "";
  return `<article class="card item p-${p}" style="--c:var(--${p === "high" ? "hi" : p === "medium" ? "me" : "lo"})">
    <div class="plain">
      <div class="hdr"><span class="pill p-${p}">${esc(x.priority)}</span><code>${esc(x.id)}</code><span class="loc">${esc(x.location)}</span></div>
      <p class="sum">${esc(x.summary)}</p>
      <p class="why">Why it matters: ${esc(x.reason)}</p>
      ${geo}<div class="valid">${esc(valid)}</div>
    </div>
    <pre>${esc(x.raw)}</pre></article>`;
}

function render(d) {
  const f = d.flight, c = d.counts, m = d.model;
  const pc = k => d.relevant.filter(x => x.priority === k).length;
  const countries = d.bulletins.map(b => b.country).join(" + ");
  const when = f.dep_time ? `dep ${day(f.dep_time)} ${hhmm(f.dep_time)} · arr ${hhmm(f.arr_time)}` : `window ${day(f.window[0])} ${hhmm(f.window[0])}–${hhmm(f.window[1])}`;
  let h = `<div class="routeline"><h2>${esc(f.dep)} ${esc(f.dep_name)} → ${esc(f.dest)} ${esc(f.dest_name)}</h2>
    <span class="meta">${f.distance_nm} nm · ${esc(when)} · GND–${f.alt_ft} ft</span></div>
    <div class="funnel">
      <div class="card stat"><div class="n">${c.national}</div><div class="l">NOTAMs in the ${esc(countries)} bulletin${d.bulletins.length > 1 ? "s" : ""}</div></div>
      <div class="card stat"><div class="n">${c.candidates}</div><div class="l">${d.prefilter ? "near your route, altitude and time" : "sent to the model (pre-filter off)"}</div></div>
      <div class="card stat key"><div class="n">${c.relevant}</div><div class="l">affect this flight</div>
        <div class="pris">${["HIGH", "MEDIUM", "LOW"].map(k => pc(k) ? `<span class="pill p-${k.toLowerCase()}">${pc(k)} ${k}</span>` : "").join("")}</div></div>
    </div>`;
  const wx = d.weather;
  if (wx.summary || wx.stations.length || wx.error) {
    h += `<section class="card wx"><h3>Weather</h3>${wx.summary ? `<p>${esc(wx.summary)}</p>` : ""}
      ${wx.error ? `<p class="small">${esc(wx.error)}</p>` : ""}
      <div class="st">${wx.stations.map(s => `<div><b>${esc(s.for)}</b> <small>${esc(s.role)}${s.station !== s.for ? ` · no METAR, using ${esc(s.station)} ${s.distance_nm} nm away` : ""}</small>
        <pre>${esc(s.metar)}${s.taf ? "\n" + esc(s.taf) : ""}</pre></div>`).join("")}</div></section>`;
  }
  if (d.unassessed.length) {
    h += `<div class="card warnbox"><b>${d.unassessed.length} NOTAM(s) were not assessed by the model.</b> Read these originals yourself:
      ${d.unassessed.map(x => `<pre class="mono">${esc(x.raw)}</pre>`).join("")}</div>`;
  }
  h += `<section class="sec"><h3>What affects this flight, most important first</h3>`;
  h += d.relevant.length ? d.relevant.map(itemCard).join("") : `<div class="card empty">No NOTAM in the bulletin affects this flight according to the model. Check the filtered list below.</div>`;
  h += `</section>`;
  if (d.not_relevant.length) {
    h += `<details class="card"><summary>${d.not_relevant.length} ${d.prefilter ? "nearby" : ""} NOTAMs judged not relevant, with reasons</summary>
      ${d.not_relevant.map(x => `<div class="nr"><div class="line"><code>${esc(x.id)}</code><span>${esc(x.location)}</span>${x.geometry ? `<span>· ${esc(x.geometry)}</span>` : ""}</div>
        <div>${esc(x.reason)}</div><details><summary>original</summary><pre>${esc(x.raw)}</pre></details></div>`).join("")}</details>`;
  }
  const u = m.usage, cost = m.cost_usd == null ? "n/a" : "$" + m.cost_usd.toFixed(m.cost_usd < 0.01 ? 5 : 4);
  h += `<div class="card foot">
    <div><b>Model</b>${esc(m.id)}${m.reasoning && m.reasoning !== "none" ? " (reasoning on)" : ""}</div>
    <div><b>Tokens in / out</b>${u.prompt_tokens.toLocaleString()} / ${u.completion_tokens.toLocaleString()}</div>
    <div><b>Cost</b>${cost}</div>
    <div><b>Pre-filter</b>${d.timing.prefilter_ms} ms (${c.national} → ${c.candidates})</div>
    <div><b>Model latency</b>${m.latency_s} s${m.calls > 1 ? ` (${m.calls} calls)` : ""}</div>
    <div><b>Total</b>${d.timing.total_s} s</div>
    <div><b>Bulletins</b>${d.bulletins.map(b => `${esc(b.country)} ${esc(day(b.generated))} ${esc(hhmm(b.generated))}`).join(", ")}${d.source !== "live" ? ` (snapshot)` : ""}</div>
  </div>${m.errors.length ? `<p class="small">Model notes: ${esc(m.errors.join("; "))}</p>` : ""}
  <p class="small">The bulletins are EAD-derived and not official documents. Always read the original NOTAMs; the pilot in command makes the final decision.</p>`;
  $("#out").innerHTML = h;
}
init();
</script>
</body>
</html>
